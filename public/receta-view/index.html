<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A8A">
  <title>Receta — Farmacia Apolo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #EDF1F8; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
    .topbar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
    .topbar a { color: #1E2A8A; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    .print-btn { background: linear-gradient(135deg, #1E2A8A, #141B5E); color: white; border: none; border-radius: 12px; padding: 10px 18px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .msg { max-width: 420px; text-align: center; color: #475569; padding: 3rem 1.5rem; font-size: 0.95rem; line-height: 1.6; }
    .msg strong { color: #1E2A8A; }
    .sheet-scaler { width: 100%; overflow: hidden; display: flex; justify-content: center; }
    .sheet-wrap { width: 8.5in; flex-shrink: 0; transform-origin: top center; }

    /* ---- Receta sheet (same layout as the doctor portal's PrintablePrescription) ---- */
    .prescription-sheet {
      width: 8.5in; height: 5.5in; margin: 0 auto; box-sizing: border-box;
      font-family: 'Century Gothic', 'Futura', 'Trebuchet MS', sans-serif;
      color: #1E2A8A; position: relative; background: white; overflow: hidden;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      box-shadow: 0 12px 32px rgba(20,27,94,0.18);
    }
    .rx-frame-img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .rx-content { position: relative; height: 100%; box-sizing: border-box; padding: 0.38in 0.45in 0.3in; display: flex; flex-direction: column; }
    .rx-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.12in; flex-shrink: 0; }
    .rx-logo { text-align: center; line-height: 1.1; letter-spacing: 3px; }
    .rx-logo-farmacia { font-size: 10pt; letter-spacing: 6px; font-weight: 400; }
    .rx-logo-apolo { font-size: 26pt; font-weight: 700; letter-spacing: 5px; margin: 1px 0; }
    .rx-logo-divider { position: relative; width: 1.9in; height: 2px; background: #1E2A8A; margin: 4px auto 5px; }
    .rx-logo-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid #2E9E7B; background: #fff; box-sizing: border-box; }
    .rx-logo-circle::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 5px; height: 5px; border-radius: 50%; background: #1E2A8A; }
    .rx-logo-slogan { font-size: 6.5pt; letter-spacing: 1.5px; }
    .rx-doctor-info { padding-top: 0.08in; font-size: 9.5pt; line-height: 1.9; letter-spacing: 1px; }
    .rx-doctor-info label { font-weight: 700; }
    .rx-doctor-info .underline { display: inline-block; min-width: 1.7in; border-bottom: 1px solid #1E2A8A; margin-left: 4px; }
    .rx-header-right { display: flex; align-items: flex-start; gap: 0.12in; }
    .rx-caduceus { width: 0.5in; height: 0.68in; flex-shrink: 0; padding-top: 0.05in; }
    .rx-body { display: flex; gap: 0.14in; margin-top: 0.06in; flex: 1; min-height: 0; position: relative; }
    .rx-vitals { width: 1.05in; font-size: 8pt; line-height: 1.75; flex-shrink: 0; border-right: 1px solid #1E2A8A; padding-right: 0.08in; }
    .rx-vitals label { font-weight: 700; display: inline-block; width: 0.5in; font-size: 6.5pt; }
    .rx-vitals .vline { display: inline-block; width: 0.38in; border-bottom: 1px solid #1E2A8A; text-align: center; font-size: 8pt; white-space: normal; vertical-align: bottom; line-height: 1.2; }
    .rx-main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    .rx-watermark { position: absolute; right: 0.05in; top: 0.35in; width: 2.9in; pointer-events: none; }
    .rx-patient-header { display: flex; justify-content: space-between; font-size: 9.5pt; margin-bottom: 0.12in; flex-shrink: 0; letter-spacing: 1px; position: relative; }
    .rx-patient-header label { font-weight: 700; }
    .rx-patient-header .underline { display: inline-block; min-width: 2in; border-bottom: 1px solid #1E2A8A; margin-left: 4px; }
    .rx-medications { font-size: 11pt; line-height: 1.6; padding-left: 0.1in; flex: 1; overflow: hidden; position: relative; }
    .rx-med-item { margin-bottom: 0.08in; }
    .rx-med-name { font-weight: 700; text-transform: uppercase; }
    .rx-med-detail { font-size: 10pt; padding-left: 0.15in; }
    .rx-indicaciones { border: 1px solid #1E2A8A; border-radius: 2pt; margin: 0.05in 0.1in 0; padding: 0.05in 0.08in 0.08in; min-height: 0.5in; flex-shrink: 0; position: relative; }
    .rx-indicaciones label { font-weight: 700; font-size: 9pt; }
    .rx-indicaciones .indicaciones-text { font-size: 10pt; white-space: pre-wrap; margin-top: 0.03in; }
    .rx-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; flex-shrink: 0; position: relative; }
    .rx-next-appointment { margin-top: 0.1in; font-size: 9pt; display: flex; align-items: center; gap: 0.1in; flex-shrink: 0; letter-spacing: 1px; position: relative; }
    .rx-next-appointment label { font-weight: 700; }
    .rx-next-appointment .date-box { display: inline-block; width: 0.35in; border-bottom: 1px solid #1E2A8A; text-align: center; }
    .rx-signature { text-align: center; font-size: 7pt; letter-spacing: 1px; padding-right: 0.35in; }
    .rx-signature .sig-line { width: 1.7in; height: 0.3in; border-bottom: 1px solid #1E2A8A; display: flex; align-items: flex-end; justify-content: center; font-size: 7pt; padding-bottom: 2px; letter-spacing: 0.3px; }
    .rx-signature label { font-weight: 700; display: block; margin-top: 2px; }
    .rx-footer { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 0.1in; padding-top: 0.08in; border-top: 1px solid #1E2A8A; font-size: 7pt; line-height: 1.5; flex-shrink: 0; letter-spacing: 0.5px; }
    .rx-footer-col { display: flex; align-items: flex-start; gap: 6px; max-width: 2.2in; }
    .rx-footer-icon { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
    .rx-footer strong { font-size: 7pt; display: block; margin-bottom: 1px; }
    .rx-folio { text-align: center; font-size: 9pt; letter-spacing: 1px; }
    .rx-folio label { font-weight: 700; display: block; }
    .rx-folio .folio-number { font-size: 11pt; font-weight: 700; font-family: monospace; }
    /* Long recetas still fit the half sheet: compact footer first, then a smaller meds block. */
    .rx-compact .rx-footer { font-size: 6pt; line-height: 1.3; margin-top: 0.06in; padding-top: 0.05in; }
    .rx-compact .rx-footer strong { font-size: 6pt; }
    .rx-compact .rx-footer-icon { width: 12px; height: 12px; }
    .rx-compact .rx-folio { font-size: 8pt; }
    .rx-compact .rx-folio .folio-number { font-size: 9.5pt; }
    .rx-xcompact .rx-footer { font-size: 5.5pt; line-height: 1.2; margin-top: 0.04in; padding-top: 0.04in; }
    .rx-xcompact .rx-footer strong { font-size: 5.5pt; }
    .rx-xcompact .rx-footer-icon { width: 11px; height: 11px; }
    .rx-xcompact .rx-folio { font-size: 7.5pt; }
    .rx-xcompact .rx-folio .folio-number { font-size: 8.5pt; }
    .rx-xcompact .rx-medications { font-size: 9.5pt; line-height: 1.35; }
    .rx-xcompact .rx-med-item { margin-bottom: 0.05in; }
    .rx-xcompact .rx-med-detail { font-size: 8.5pt; }
    .rx-xcompact .rx-indicaciones { min-height: 0.4in; }
    .rx-xcompact .rx-indicaciones .indicaciones-text { font-size: 9pt; }

    @media print {
      @page { size: letter; margin: 0; }
      body { background: white; }
      .topbar, .msg { display: none !important; }
      .sheet-scaler { overflow: visible; }
      .sheet-wrap { transform: none !important; }
      .prescription-sheet { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/customer-app/">← Volver a la app</a>
    <button class="print-btn" onclick="window.print()">Imprimir / PDF</button>
  </div>
  <div class="sheet-scaler" id="scaler" style="display: none;">
    <div class="sheet-wrap" id="sheet-wrap"></div>
  </div>
  <div class="msg" id="msg">Cargando tu receta…</div>

  <script src="/vendor/supabase-js.min.js"></script>
  <script src="/customer-app/js/supabase.js?v=1"></script>
  <script>
    (function () {
      'use strict';
      var msg = document.getElementById('msg');
      var scaler = document.getElementById('scaler');
      var wrap = document.getElementById('sheet-wrap');

      function fail(html) { msg.innerHTML = html; }
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function age(dob) {
        if (!dob) return '';
        var b = new Date(dob), t = new Date(), a = t.getFullYear() - b.getFullYear();
        var m = t.getMonth() - b.getMonth();
        if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
        return String(a);
      }
      function parts(d) {
        if (!d) return { day: '__', month: '__', year: '____' };
        var x = new Date(d);
        return {
          day: String(x.getDate()).padStart(2, '0'),
          month: String(x.getMonth() + 1).padStart(2, '0'),
          year: String(x.getFullYear())
        };
      }
      function fit() {
        var w = Math.min(document.documentElement.clientWidth, 900);
        var sheetW = 8.5 * 96;
        var scale = Math.min(1, (w - 8) / sheetW);
        wrap.style.transform = 'scale(' + scale + ')';
        wrap.parentElement.style.height = (5.5 * 96 * scale + 12) + 'px';
      }
      window.addEventListener('resize', fit);

      function render(rx, customer) {
        var meds = Array.isArray(rx.medications) && rx.medications.length ? rx.medications
          : rx.medication ? [{ medication: rx.medication, dosage: rx.dosage, frequency: rx.frequency, duration: rx.duration, notes: rx.notes }] : [];
        var rxDate = parts(rx.prescription_date || rx.created_at);
        var next = parts(rx.next_appointment);
        var v = {
          edad: rx.edad || age(customer && customer.date_of_birth),
          peso: rx.weight_kg || (customer && customer.weight) || '',
          talla: rx.height_cm || (customer && customer.height) || '',
          temp: rx.temperatura || '', ta: rx.ta || '', fc: rx.fc || '', fr: rx.fr || '',
          so2: rx.so2 || '', glicemia: rx.glicemia || '', alergias: rx.alergias || ''
        };
        var vitalsRows = [['EDAD:', v.edad], ['PESO:', v.peso], ['TALLA:', v.talla], ['TEMP:', v.temp],
          ['T/A:', v.ta], ['FC:', v.fc], ['FR:', v.fr], ['SO2%:', v.so2], ['GLICEMIA:', v.glicemia], ['ALERGIAS:', v.alergias]]
          .filter(function (r) { return r[1] !== '' && r[1] !== null && r[1] !== undefined; })
          .map(function (r) { return '<div><label>' + r[0] + '</label><span class="vline">' + esc(r[1]) + '</span></div>'; }).join('');
        var medsHtml = meds.map(function (m) {
          var detail = [m.dosage, m.via, m.frequency, m.duration].filter(Boolean).join(' · ');
          return '<div class="rx-med-item"><div class="rx-med-name">' + esc(m.medication) + '</div>' +
            (detail ? '<div class="rx-med-detail">' + esc(detail) + '</div>' : '') +
            (m.notes ? '<div class="rx-med-detail" style="font-style: italic;">' + esc(m.notes) + '</div>' : '') + '</div>';
        }).join('');
        // The receta must always fit a half sheet (media carta): estimate the
        // printed line count and compact the footer (then meds) when long.
        var estMedLines = meds.reduce(function (n, m) {
          var d = [m.dosage, m.via, m.frequency, m.duration].filter(Boolean).join(' · ');
          return n + 1 + (d ? Math.max(1, Math.ceil(d.length / 65)) : 0) + (m.notes ? 1 : 0);
        }, 0);
        var indicLen = (rx.indicaciones || '').trim().length;
        var contentLines = estMedLines + (indicLen ? Math.ceil(indicLen / 70) : 0);
        var compactClass = contentLines > 9 ? ' rx-xcompact' : contentLines > 5 ? ' rx-compact' : '';

        wrap.innerHTML =
          '<div class="prescription-sheet' + compactClass + '">' +
            '<img class="rx-frame-img" src="/brand/receta-frame.png" alt="" />' +
            '<div class="rx-content">' +
              '<div class="rx-header">' +
                '<div class="rx-logo">' +
                  '<div class="rx-logo-farmacia">— FARMACIA —</div>' +
                  '<div class="rx-logo-apolo">APOLO</div>' +
                  '<div class="rx-logo-divider"><span class="rx-logo-circle"></span></div>' +
                  '<div class="rx-logo-slogan">CUIDAMOS DE TI, CUIDAMOS TU SALUD</div>' +
                '</div>' +
                '<div class="rx-header-right">' +
                  '<div class="rx-doctor-info">' +
                    '<div><label>NOMBRE DE DOCTOR:</label><span class="underline">' + esc(rx.doctor_name || (rx.profiles && rx.profiles.full_name) || '') + '</span></div>' +
                    '<div><label>CÉDULA:</label><span class="underline">' + esc(rx.doctor_license_number || '') + '</span></div>' +
                  '</div>' +
                  '<svg class="rx-caduceus" viewBox="0 0 48 64" fill="none" stroke="#1E2A8A" stroke-width="2" stroke-linecap="round">' +
                    '<path d="M24 12 C18 3 8 3 4 9 C10 9 14 11 17 15 C12 15 8 18 7 22 C12 20 16 21 19 23" />' +
                    '<path d="M24 12 C30 3 40 3 44 9 C38 9 34 11 31 15 C36 15 40 18 41 22 C36 20 32 21 29 23" />' +
                    '<circle cx="24" cy="6" r="2.6" /><line x1="24" y1="9" x2="24" y2="61" />' +
                    '<path d="M24 18 C15 22 33 26 24 30 C15 34 33 38 24 42 C15 46 31 50 24 54" />' +
                    '<path d="M24 18 C33 22 15 26 24 30 C33 34 15 38 24 42 C33 46 17 50 24 54" />' +
                  '</svg>' +
                '</div>' +
              '</div>' +
              '<div class="rx-body">' +
                '<div class="rx-vitals">' + vitalsRows + '</div>' +
                '<div class="rx-main">' +
                  '<img class="rx-watermark" src="/brand/receta-watermark.png" alt="" />' +
                  '<div class="rx-patient-header">' +
                    '<div><label>NOMBRE:</label><span class="underline">' + esc(rx.patient_name || (customer && customer.full_name) || '') + '</span></div>' +
                    '<div><label>FECHA:</label>' +
                      '<span class="underline" style="min-width: 0.4in; text-align: center;">' + rxDate.day + '</span><span>/</span>' +
                      '<span class="underline" style="min-width: 0.4in; text-align: center;">' + rxDate.month + '</span><span>/</span>' +
                      '<span class="underline" style="min-width: 0.5in; text-align: center;">' + rxDate.year + '</span>' +
                    '</div>' +
                  '</div>' +
                  '<div class="rx-medications">' + medsHtml + '</div>' +
                  '<div class="rx-indicaciones"><label>INDICACIONES:</label>' +
                    (rx.indicaciones ? '<div class="indicaciones-text">' + esc(rx.indicaciones) + '</div>' : '') +
                  '</div>' +
                  '<div class="rx-bottom-row">' +
                    '<div class="rx-next-appointment"><label>PRÓXIMA CITA:</label>' +
                      '<span class="date-box">' + next.day + '</span><span>/</span>' +
                      '<span class="date-box">' + next.month + '</span><span>/</span>' +
                      '<span class="date-box">' + next.year + '</span>' +
                    '</div>' +
                    '<div class="rx-signature">' +
                      '<div class="sig-line">' + (rx.signature ? 'Firmada electrónicamente' : '') + '</div>' +
                      '<label>FIRMA DEL MÉDICO</label>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div class="rx-footer">' +
                '<div class="rx-footer-col" style="padding-left: 0.12in;">' +
                  '<svg class="rx-footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
                  '<div><strong>AV. CENTENARIO 169, ESQ. COMETA 4,</strong>SAN ANTONIO ZOMEYUCAN, 53750,<br />NAUCALPAN DE JUÁREZ, MÉX.</div>' +
                '</div>' +
                '<div class="rx-footer-col">' +
                  '<svg class="rx-footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
                  '<div><strong>HORARIO:</strong>LUNES A VIERNES<br />10 A 20 HRS.<br />SÁBADO<br />11 A 19 HRS.</div>' +
                '</div>' +
                '<div class="rx-footer-col">' +
                  '<svg class="rx-footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
                  '<div><strong>CONTACTO:</strong>55-2483-7003</div>' +
                '</div>' +
                '<div class="rx-folio"><label>FOLIO No.</label><div class="folio-number">' + esc(rx.prescription_number || '') + '</div></div>' +
              '</div>' +
            '</div>' +
          '</div>';

        msg.style.display = 'none';
        scaler.style.display = 'flex';
        fit();
      }

      async function main() {
        var id = new URLSearchParams(location.search).get('rx');
        if (!id) return fail('Falta el identificador de la receta.');
        var sb = window.farmaciaSupabase;
        if (!sb) return fail('No hay conexión. Revisa tu internet e intenta de nuevo.');
        var user = (await sb.auth.getUser()).data.user;
        if (!user) return fail('Inicia sesión en la app para ver tu receta.<br><br><a href="/customer-app/" style="color:#1E2A8A; font-weight:700;">Ir a la app</a>');

        var rxRes = await sb.from('prescriptions').select('*, profiles:doctor_id(full_name)').eq('id', id).single();
        if (rxRes.error || !rxRes.data) {
          return fail('No encontramos esta receta en tu cuenta.<br><br><a href="/customer-app/" style="color:#1E2A8A; font-weight:700;">Volver a la app</a>');
        }
        var custRes = await sb.from('customers')
          .select('full_name, date_of_birth, weight, height')
          .eq('profile_id', user.id).single();
        render(rxRes.data, custRes.data || null);
      }
      main().catch(function (e) {
        console.error(e);
        fail('Ocurrió un error cargando la receta. Intenta de nuevo.');
      });
    })();
  </script>
</body>
</html>
