project_id = "ieinjhonepkudxxpmuly"

# Receta/consulta e.firma signing — caller must present a valid user JWT;
# the function additionally enforces role=doctor + is_active, e.firma key
# binding (doctor_efirma), and a per-user rate limit
[functions.sign-document]
verify_jwt = true

[functions.paypal-subscription]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false

[functions.paypal-subscription-status]
verify_jwt = true

# Member self-service cancellation — caller is the member's portal session
[functions.cancel-my-membership]
verify_jwt = true

# Family-member account activation — the person has no session yet; the
# registered member name is the identity proof
[functions.family-member-signup]
verify_jwt = false

[functions.paypal-capture-consult]
verify_jwt = false

# Public in-store tablet check-in (no user session on the tablet)
[functions.tablet-checkin]
verify_jwt = false

# Login-identifier resolution for the customer portal (R2-16) — no session
# yet by definition; the direct anon grant on the DB function is revoked, so
# this wrapper is the only path. Abuse bounded by per-IP rate limiting.
[functions.lookup-login-email]
verify_jwt = false

# Public receta verification for pharmacists (LGS 42 Bis) — no session;
# response is minimal by design, abuse bounded by per-IP rate limiting
[functions.verify-receta]
verify_jwt = false

# Cron-invoked queue processor — auth is via the x-cron-secret header instead
[functions.send-notifications]
verify_jwt = false

# Public afiliado (partner business) self-registration — no session yet by
# definition. Abuse bounded by honeypot + per-IP rate limiting; responses are
# generic so the endpoint can't be used to enumerate accounts.
[functions.affiliate-signup]
verify_jwt = false

# Public Stripe membership signup (new signups only; existing PayPal members
# keep PayPal) — no session yet by definition, same posture as
# paypal-subscription.
[functions.stripe-membership-signup]
verify_jwt = false

# POS card operations (authorize/capture/void + POS membership → Stripe
# subscription) — staff only; the function itself requires an admin/pos
# profile.
[functions.stripe-pos-charge]
verify_jwt = true

[functions.stripe-subscription-status]
verify_jwt = true

# Stripe membership webhook — no session, auth is the Stripe-Signature header
# (HMAC verified against STRIPE_WEBHOOK_SECRET inside the function).
[functions.stripe-webhook]
verify_jwt = false

# Public teleconsulta payment verification (Stripe PaymentIntent) — replaces
# paypal-capture-consult for new payments; same public posture.
[functions.stripe-capture-consult]
verify_jwt = false

# Public Plan Empresa signup (Stripe SetupIntent → trialing subscription,
# quantity = seats) — no session yet by definition. Abuse bounded by per-IP
# rate limiting; client-facing errors are generic (R2-38).
[functions.empresa-signup]
verify_jwt = false

# Plan Empresa roster activation via the one-time setup_token (48 h TTL) —
# no session; the token is the capability. Abuse bounded by per-IP rate
# limiting.
[functions.empresa-setup]
verify_jwt = false

# Plan Empresa roster management — caller is the employer's portal session;
# the function additionally enforces membership ownership (customers
# .profile_id or the owner membership_members.claimed_user_id).
[functions.empresa-roster]
verify_jwt = true
